[project]
name = "security-review-ai"
version = "0.1.0"
description = "AI Security Review Backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2",
    "httpx>=0.27",
    "bandit>=1.8.0",
    "safety>=3.0.0",
    "pip-audit>=2.6.0",
    "detect-secrets>=1.4.0",
    "pyjwt>=2.9.0",
    "prometheus-client>=0.26.0",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "stripe>=15.4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
