services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: security-review-ai-backend
    ports:
      - "8000:8000"
    environment:
      SECURITY_REVIEW_AUTH_REQUIRED: "false"
      SECURITY_REVIEW_API_KEY: "demo-key"
      SECURITY_REVIEW_JWT_SECRET: "change-me-to-a-random-32-byte-secret-in-production"
    volumes:
      - ./backend/data:/app/data
    command: ["python", "-m", "uvicorn", "security_review.main:app", "--host", "0.0.0.0", "--port", "8000"]
