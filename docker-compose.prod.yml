version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigil-ai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      SECURITY_REVIEW_ENVIRONMENT: production
      SECURITY_REVIEW_LOG_LEVEL: INFO
      SECURITY_REVIEW_AUTH_REQUIRED: "true"
      SECURITY_REVIEW_PAYMENT_PROVIDER: stripe
      DATABASE_URL: postgresql+psycopg://vigil:vigil@postgres:5432/vigil
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/src
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["python", "-m", "uvicorn", "security_review.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: vigil-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigil
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vigil-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  backend-data:
  postgres-data:
  redis-data:
